# Supabase local dev config. `supabase start` uses this; `supabase db reset`
# applies migrations/ then seed.sql. Edge Functions live in functions/.
project_id = "liz"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "io.supabase.liz://login-callback"]
jwt_expiry = 3600
# Sign-in is Firebase's (docs/AUTH.md). Supabase's own sign-up stays off:
# with it on, anyone could create an unverified Supabase account and act as a
# signed-in user without going through Firebase at all. Sessions it issued
# before the switch still work; current_uid() accepts them.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Fill these in for social sign-in (see README).
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[functions.ask-liz]
verify_jwt = false

# The ingestion functions run with the service role and spend real quota, so
# they check the caller themselves (see functions/_shared/auth.ts). verify_jwt
# stays on as a cheap first gate: it turns away a request with no credentials
# before an instance is even started. It is not the real gate -- the anon key
# is a valid JWT and ships in the client bundle.
[functions.fetch-news]
verify_jwt = true

[functions.fetch-tools]
verify_jwt = true

[functions.embed-tools]
verify_jwt = true

[functions.summarize-tools]
verify_jwt = true

# Both take a Firebase ID token and verify it themselves (migration 0055).
[functions.delete-account]
verify_jwt = false

[functions.firebase-session]
verify_jwt = false

# Image requests from the browser carry no Authorization header, so the logo
# proxy must not require a JWT; it rate-limits by address and can only fetch
# images (see functions/logo/logic.ts). Listed explicitly so a deploy of every
# function (`supabase functions deploy`, deploy-supabase.yml) cannot flip it.
[functions.logo]
verify_jwt = false

# Called by the app with the public anon key.
[functions.tool-updates]
verify_jwt = true

# Called only by the database with the service role.
[functions.send-notification]
verify_jwt = true

# Sign-in is Firebase Authentication (migration 0055). The hosted project needs
# the same integration added in the dashboard: Authentication → Third-party
# Auth → Firebase, project ID liz-f5f93.
[auth.third_party.firebase]
enabled = true
project_id = "liz-f5f93"

# The laptop scraper holds its own key for this function (LIZ_INGEST_KEY),
# not a Supabase key; the function checks it itself.
[functions.scraper-ingest]
verify_jwt = false

# The Repository Analyzer: signed-in people only, checked in the function
# (a Firebase token is not a Supabase JWT; see _shared/repo/caller.ts).
[functions.analyze-repo]
verify_jwt = false

[functions.ask-repo]
verify_jwt = false
