name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      description: Some directions are deliberately closed (README, "Deliberate decisions").
      options:
        - label: It does not need a paid AI API.
          required: true
