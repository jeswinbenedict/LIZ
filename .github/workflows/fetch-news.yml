# Free, reliable hourly scheduler for the tech-news ingestion.
# Calls the `fetch-news` Supabase Edge Function, which pulls the latest tech
# headlines (RSS + Hacker News + Dev.to) into the `news` table. New articles are
# pushed to the app live over Supabase Realtime.
#
# Setup (one time):
#   1. Deploy the function:  supabase functions deploy fetch-news
#   2. In GitHub → repo → Settings → Secrets and variables → Actions, add:
#        SUPABASE_FUNCTIONS_URL   e.g. https://<ref>.functions.supabase.co
#        SUPABASE_SERVICE_ROLE_KEY  your project's service role key (secret)
#   3. Use the button to fetch news on demand; the hourly run is pg_cron's.

name: fetch-news

# Manual only. The hourly schedule lives in the database (pg_cron job
# `fetch-news-hourly`, migration 0032), which already calls the function every
# hour; this workflow called it a second time each hour and spent about 720 of
# the 2,000 free Actions minutes a month doing so.
on:
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tech-news ingestion
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$FUNCTIONS_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::warning::SUPABASE_FUNCTIONS_URL / SUPABASE_SERVICE_ROLE_KEY not set — skipping."
            echo "Add them in Settings → Secrets and variables → Actions to enable ingestion."
            exit 0
          fi
          curl -sS -X POST "$FUNCTIONS_URL/fetch-news" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
