# Free scheduler for the BeautifulSoup tool scraper — Hacker News only.
#
# Runs discovery + enrichment, and the quality gate (scrapers/liz_scraper/
# quality.py) decides per row whether it is published or held with a reason.
#
# Product Hunt is left to the n8n workflow on the machine at home
# (n8n/README.md). Its edge answers 403 to every GitHub Actions runner, so
# scraping it here only wrote rows held as "still the listing" for n8n to
# fix twelve hours later — two requests per launch for one result.
#
# Setup (one time): repo → Settings → Secrets and variables → Actions, add
#   SUPABASE_URL                e.g. https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   server-side key (never ship this in the app)

name: scrape-tools

on:
  schedule:
    - cron: '30 3 * * *' # daily, offset from the 04:15 fetch-tools cron
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing to Supabase'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scrapers/requirements.txt

      - name: Run scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not set — running dry."
            python -m liz_scraper --source hackernews --dry-run --limit 20
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m liz_scraper --source hackernews --dry-run --limit 20
          else
            # No --status: the quality gate decides per row. Passing
            # --status pending here forced every row into the review queue and
            # bypassed the gate entirely.
            python -m liz_scraper --source hackernews --limit 20
          fi

      # A tool without an embedding is invisible to Ask Liz, so backfill in the
      # same run rather than leaving newly scraped rows unsearchable until the
      # next scheduled pass.
      - name: Embed newly ingested tools
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping embedding."
            exit 0
          fi
          # One invocation embeds only a handful of tools before the edge worker
          # runs out of compute, so repeat until the backlog is clear.
          for i in $(seq 1 30); do
            body=$(curl -sS -X POST "$SUPABASE_URL/functions/v1/embed-tools" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"limit":5}') || true
            echo "$body"
            remaining=$(printf '%s' "$body" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            # `if`, not `[ … ] && …`: a false test as the loop's last command
            # became the step's exit status, failing a run that only ran out
            # of rounds before the backlog did.
            if [ "$remaining" = "0" ]; then break; fi
            if [ -z "$remaining" ]; then sleep 5; fi
          done

      # A tool with no bullets shows an empty "AI summary" on its detail page.
      - name: Summarize newly ingested tools
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping summaries."
            exit 0
          fi
          # Each row costs an LLM call, so cap the work rather than the backlog:
          # the rest is picked up by the next run.
          for i in $(seq 1 12); do
            body=$(curl -sS -X POST "$SUPABASE_URL/functions/v1/summarize-tools" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"limit":6}') || true
            echo "$body"
            # The AI provider refused its key (expired or revoked). No later
            # round can succeed, so stop the rounds and say what to renew.
            # A warning, not a failure: the tools were scraped and published;
            # only their summaries wait, and the pg_cron backfill writes them
            # once the key works again. The health check (0024/0047) pushes an
            # alert when summary coverage falls.
            if printf '%s' "$body" | grep -q '"error":"ai_credentials'; then
              echo "::warning title=AI key refused::The AI provider rejected AI_API_KEY (expired or revoked), so no summaries can be written. Create a new free key (console.groq.com → API Keys), then run: supabase secrets set AI_API_KEY=<new key>. Setting the AI_FALLBACK_* secrets keeps summaries running through the next expiry (docs/OPERATIONS.md)."
              {
                echo "### AI summaries paused"
                echo "The AI provider refused \`AI_API_KEY\`. Tools were scraped and published; their summaries will be written automatically once the key works."
                echo ""
                echo "Fix: create a key at console.groq.com → API Keys, then \`supabase secrets set AI_API_KEY=<key>\` (only the key, no brackets or quotes)."
              } >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            remaining=$(printf '%s' "$body" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ "$remaining" = "0" ]; then break; fi
            if [ -z "$remaining" ]; then sleep 5; fi
          done

      # GitHub stars and Hacker News points, read every day: Rising is growth
      # between daily snapshots, so a skipped day is history lost for good.
      # apply_signals() then takes today's snapshot and re-ranks, which is why
      # this runs last, once the new rows are in. GITHUB_TOKEN raises GitHub's
      # search allowance from 10 to 30 requests a minute.
      - name: Read signals, snapshot and rank
        if: ${{ inputs.dry_run != true }}
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping signals."
            exit 0
          fi
          python -m liz_scraper.signals

      # New tools arrive with a logo on someone else's server, fetched through
      # an Edge Function on every view. Store each once as a small WebP in the
      # public `logos` bucket so the Storage CDN serves it (migration 0048).
      - name: Store new logos
        if: ${{ inputs.dry_run != true }}
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping logos."
            exit 0
          fi
          python -m liz_scraper.store_logos --apply --limit 200

      # A site can be compromised after it was listed. Hold any published tool
      # whose host is on the malware or phishing list (liz_scraper.threats).
      # Fails the run when no list could be fetched, so screening never stops
      # unnoticed.
      - name: Check sites against the malware and phishing lists
        if: ${{ inputs.dry_run != true }}
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping."
            exit 0
          fi
          python -m liz_scraper.threats --apply
