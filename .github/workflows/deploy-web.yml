# Builds the web app and publishes it to Cloudflare Pages whenever CI passes
# on main, and once a day. Free tier: unlimited static requests, served from Cloudflare's edge.
#
# Setup (one time):
#   1. Cloudflare dashboard → Workers & Pages → Create → Pages → "Direct
#      upload", project name `liz` (or set CLOUDFLARE_PROJECT below).
#   2. My Profile → API Tokens → Create token → "Edit Cloudflare Workers"
#      template (it covers Pages). Copy it.
#   3. Repo → Settings → Secrets and variables → Actions, add:
#        CLOUDFLARE_API_TOKEN     the token from step 2
#        CLOUDFLARE_ACCOUNT_ID    Workers & Pages → right-hand sidebar
#        SUPABASE_URL             same as the scraper uses
#        SUPABASE_ANON_KEY        the public key (safe in the client)
#        FCM_VAPID_KEY            optional; browser notifications
#        SITE_URL                 e.g. https://liz.pages.dev — used for share links
#
# Until the Cloudflare secrets exist the job builds and stops, with a warning,
# so the build itself stays checked on every push.
#
# The catalog changes daily but a deploy only happens on push, so the
# pre-rendered pages would go stale; the schedule below rebuilds once a day,
# after the scraper and the nightly ranking have run.
#
# Path URLs (/tools/elevenlabs) need the host to serve index.html for any path
# that is not a file. Pages does that for a site with no top-level 404.html,
# which a Flutter build does not have. Security headers come from
# web/_headers, which Flutter copies into build/web.

name: deploy-web

on:
  # After CI, not on push: a commit whose tests fail must not go live. The job
  # below checks that the CI run it follows actually passed.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 5 * * *' # after scrape-tools (03:30) and snapshot-and-rank (04:50)
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT: liz

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get

      # WebAssembly with a JavaScript fallback: about 30% smaller for browsers
      # that support it (docs/WEB_BUILD.md).
      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          VERSION="${GITHUB_SHA::7}"
          flutter build web --release --wasm --source-maps \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FCM_VAPID_KEY="$FCM_VAPID_KEY" \
            --dart-define=SITE_URL="$SITE_URL" \
            --dart-define=APP_VERSION="$VERSION"
          test -f build/web/_headers
          # Source maps turn a minified crash report back into Dart files and
          # lines (tool/symbolicate.py). They stay out of the public site —
          # they are the source — and are kept with the run instead, named by
          # the version every crash report carries.
          mkdir -p sourcemaps
          find build/web -name '*.map' -exec mv {} sourcemaps/ \;
          ls sourcemaps
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ env.APP_VERSION }}
          path: sourcemaps/
          retention-days: 90
          if-no-files-found: warn

      # One HTML page per tool and category, with its own title, description,
      # structured data and text, plus sitemap.xml and robots.txt — so search
      # engines and link previews see more than an empty app shell. Reads
      # published rows with the public anon key. docs/SEO.md.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Pre-render pages for search engines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        working-directory: scrapers
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping pre-rendering."
            exit 0
          fi
          pip install -r requirements.txt
          python -m liz_scraper.prerender --build ../build/web --site "$SITE_URL"

      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Cloudflare secrets not set — built but not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=main

      # A deploy that "succeeded" but serves a broken site is the worst kind.
      # Fetch the home page, one tool page and the sitemap from the live
      # address, and fail the run if any is wrong. Pages takes a few seconds to
      # serve a new deployment, so allow a couple of retries.
      - name: Smoke test the live site
        if: steps.cf.outputs.ready == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL not set — skipping the smoke test."
            exit 0
          fi
          check() { # url, text the page must contain
            for i in 1 2 3 4 5; do
              body=$(curl -fsSL --max-time 20 "$1") && echo "$body" | grep -q "$2" && return 0
              sleep 10
            done
            echo "::error::$1 did not contain: $2"
            return 1
          }
          check "$SITE_URL/" 'flutter_bootstrap.js'
          tool=$(ls build/web/tools | head -1 | sed 's/\.html$//')
          check "$SITE_URL/tools/$tool" '| Liz</title>'
          check "$SITE_URL/sitemap.xml" '<urlset'
          check "$SITE_URL/robots.txt" 'Sitemap:'
