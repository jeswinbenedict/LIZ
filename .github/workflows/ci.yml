# Gate every push/PR on a clean analyze + test run so broken code can't reach main.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new stable release can't fail unrelated PRs with lints the
      # team hasn't seen locally. go_router 18 and cached_network_image 4 need
      # Dart 3.12, the floor in pubspec.yaml — bump both together, and keep a
      # local SDK on the same version (`flutter --version`).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      # Clean at every level, infos included, since September 2026. Keeping it
      # fatal is what stops a backlog of 50 "only infos" from growing back.
      # One formatting, so a diff shows what changed and nothing else.
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scrapers/requirements.txt ruff==0.6.9
      # Lint first: an unused import or an undefined name is cheaper to catch
      # here than in a 3 a.m. scrape. Config in scrapers/pyproject.toml.
      - run: ruff check scrapers tool --config scrapers/pyproject.toml
      - run: python -m pytest scrapers/tests -q

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --allow-env because _shared/ai.ts reads its provider config at import.
      - run: deno test --allow-env --no-check supabase/functions/tests/
      # Type-checks the handlers the tests do not import, so a broken function
      # is caught here rather than on deploy.
      - run: |
          for f in ask-liz delete-account embed-tools fetch-news fetch-tools \
                   firebase-session logo send-notification summarize-news \
                   summarize-tools tool-updates; do
            deno check "supabase/functions/$f/index.ts"
          done

  # Every migration, in order, on an empty database — the database a restore
  # or a new environment starts from. Migrations are applied to the live
  # project one at a time as they are written, so one that only works on top
  # of the live data (or on a function a later migration replaced) would
  # otherwise go unnoticed until the day it mattered.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      # Starts Postgres alone (not the whole stack), applies supabase/migrations
      # and then seed.sql. Fails on the first statement that errors.
      - run: supabase db start
      - name: The schema is what the app expects
        run: |
          supabase db query --local "select public.current_uid() is null as guest,
            (select count(*) from public.tools) as seeded_tools,
            (select count(*) from pg_policies where schemaname = 'public') as policies"
      # A signed-in person once could make themselves admin with one request.
      # psql, not `supabase db query`, which sends one statement at a time.
      - name: Signed-in people cannot change protected columns
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/guards.sql

  # The app in a real browser, on the bundled demo data: visitor journeys, the
  # accessibility tree of every page, and a sweep for errors and overflow
  # (tool/qa/README.md). Each has caught a bug every widget test passed — the
  # address bar not following the page, controls the keyboard could not
  # reach, headings that swallowed their sections.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter build web --release
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Serve the build
        run: |
          python tool/qa/serve.py build/web 8100 &
          for i in $(seq 1 30); do curl -sf http://localhost:8100/ >/dev/null && break; sleep 1; done
      - run: python tool/qa/journeys.py chromium
      - run: python tool/qa/journeys.py chromium --phone
      - run: python tool/qa/a11y_audit.py
      - run: python tool/qa/sweep.py chromium --key
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks
          # The scripts' default: liz-qa in the system temp folder.
          path: /tmp/liz-qa
          retention-days: 14
