# Gate every push/PR on a clean analyze + test run so broken code can't reach main.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new stable release can't fail unrelated PRs with lints the
      # team hasn't seen locally. go_router 18 and cached_network_image 4 need
      # Dart 3.12, the floor in pubspec.yaml — bump both together, and keep a
      # local SDK on the same version (`flutter --version`).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      # Clean at every level, infos included, since September 2026. Keeping it
      # fatal is what stops a backlog of 50 "only infos" from growing back.
      # One formatting, so a diff shows what changed and nothing else.
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scrapers/requirements.txt ruff==0.6.9
      # Lint first: an unused import or an undefined name is cheaper to catch
      # here than in a 3 a.m. scrape. Config in scrapers/pyproject.toml.
      - run: ruff check scrapers tool --config scrapers/pyproject.toml
      - run: python -m pytest scrapers/tests -q

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --allow-env because _shared/ai.ts reads its provider config at import.
      - run: deno test --allow-env --no-check supabase/functions/tests/
      # Type-checks the handlers the tests do not import, so a broken function
      # is caught here rather than on deploy.
      - run: |
          for f in ask-liz delete-account embed-tools fetch-news fetch-tools \
                   firebase-session logo send-notification summarize-tools \
                   tool-updates; do
            deno check "supabase/functions/$f/index.ts"
          done
