# Gate every push/PR on a clean analyze + test run so broken code can't reach main.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new stable release can't fail unrelated PRs with lints the
      # team hasn't seen locally. This is the oldest stable whose Dart SDK
      # satisfies the ^3.11.0 constraint in pubspec.yaml — bump both together.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors and warnings block the merge. The repo still carries ~43
      # info-level lints; promote these to fatal once that backlog is cleared.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scrapers/requirements.txt
      - run: python -m pytest scrapers/tests -q

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --allow-env because _shared/ai.ts reads its provider config at import.
      - run: deno test --allow-env --no-check supabase/functions/tests/
      # Type-checks the handlers the tests do not import, so a broken function
      # is caught here rather than on deploy.
      - run: |
          for f in ask-liz embed-tools fetch-news fetch-tools; do
            deno check "supabase/functions/$f/index.ts"
          done
