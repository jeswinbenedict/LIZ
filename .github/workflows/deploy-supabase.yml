# Applies database migrations and deploys Edge Functions from CI.
#
# Until now both were run by hand from one laptop (`supabase db push`,
# `supabase functions deploy`), so the live project and the repository could
# drift — a migration applied but never committed, or committed but never
# applied. This runs after CI passes on main, only when something under
# supabase/ changed since the last successful deploy, and can be started by
# hand.
#
# "Changed" is measured from the tag `supabase-deployed`, which this job moves
# to each commit it deploys. It used to compare a commit with its parent, so a
# push of several commits whose last one did not touch supabase/ deployed
# nothing — which happened on 1 October, with four migrations in the push.
#
# Setup (one time), repository secrets:
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD    the project's database password
# The project ref is not secret and is set below. Until both secrets exist
# the job warns and does nothing.

name: deploy-supabase

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to move the supabase-deployed tag

concurrency:
  group: deploy-supabase
  cancel-in-progress: false # never interrupt a migration half way

env:
  PROJECT_REF: yluabeijvbydxczfxclk

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The commit CI tested, not whatever main is by the time this runs.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Anything to deploy?
        id: changed
        run: |
          git fetch --tags --force --quiet
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || ! git rev-parse -q --verify refs/tags/supabase-deployed >/dev/null \
             || git diff --name-only supabase-deployed HEAD | grep -q '^supabase/'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under supabase/ — nothing to deploy."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secrets
        id: secrets
        if: steps.changed.outputs.yes == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Migrations
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Remember what was deployed
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git tag -f supabase-deployed HEAD
          git push -f origin refs/tags/supabase-deployed
