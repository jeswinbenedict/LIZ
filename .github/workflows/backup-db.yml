# A weekly copy of the database, kept outside Supabase.
#
# Supabase's free plan keeps no backups you can restore from. Without this, a
# bad migration, a mistaken delete or a lost project means the catalog, every
# account and — worst — the daily signal history are gone, and the history
# cannot be collected again.
#
# pg_dump writes a compressed dump, which is encrypted (AES-256, gpg) and
# uploaded as a workflow artifact kept for 90 days (about thirteen restore
# points). The dump holds every account, so it is NEVER uploaded unencrypted:
# artifacts of a public repository can be downloaded by any GitHub user.
#
# Setup (one time), in Settings → Secrets and variables → Actions:
#   SUPABASE_DB_URL     Supabase dashboard → Connect → "Session pooler" URI,
#                       with the database password filled in.
#   BACKUP_PASSPHRASE   a long random passphrase, also kept somewhere safe
#                       outside GitHub (a password manager): without it the
#                       backups cannot be read.
# Until both are set the job warns and takes no backup.
#
# Restore, into an empty database:
#   gpg --decrypt --output liz.dump liz.dump.gpg
#   pg_restore --no-owner --no-privileges -d "<connection string>" liz.dump

name: backup-db

permissions:
  contents: read

on:
  schedule:
    - cron: '0 2 * * 0' # Sundays 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL not set — no backup was taken."
            exit 0
          fi
          # The runner's pg_dump must be at least the server's version.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file=liz.dump
          # Encrypt, then remove the plain dump before anything is uploaded.
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output liz.dump.gpg liz.dump
          shred -u liz.dump
          ls -lh liz.dump.gpg
          echo "taken=true" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: env.taken == 'true'
        with:
          name: liz-db-${{ github.run_id }}
          path: liz.dump.gpg
          if-no-files-found: error
          retention-days: 90
